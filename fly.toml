app = 'hardwarestack'
primary_region = 'arn'

[deploy]
  release_command = "node_modules/.bin/prisma migrate deploy"

[build]
  [build.args]
    # Cloudflare Web Analytics site token (public — it ships in the page HTML)
    NEXT_PUBLIC_CF_BEACON_TOKEN = "921ffb3818074637927a7590427fe5ec"
    # Amazon.de Associates tracking ID (public — it appears in every affiliate link)
    NEXT_PUBLIC_AMAZON_AFFILIATE_TAG = "hardwarestack-21"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  PORT = "3000"
  NODE_ENV = "production"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
